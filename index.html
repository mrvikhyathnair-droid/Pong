<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Pong</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 20px;
  display: flex; justify-content: center; align-items: center;
  background: #080b12; color: #f5f7ff; font-family: monospace;
}
.game { width: min(900px, 100%); text-align: center; }
h1 { margin: 0 0 8px; color: #67f5d1; font-size: clamp(30px, 6vw, 54px); letter-spacing: 12px; text-shadow: 0 0 20px #20b99a66; }
.subtitle { color: #8490a8; margin-bottom: 22px; }
.scoreboard { display: flex; justify-content: space-around; align-items: center; gap: 12px; margin: 15px 0; }
.score { font-size: clamp(35px, 7vw, 60px); color: #67f5d1; }
.player-name { font-size: 12px; color: #9ba7bd; margin-top: 5px; }
.center-label { color: #526078; font-size: 12px; white-space: nowrap; }
.status-row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; margin: 12px 0; }
.timer { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #67f5d1; }
.status { min-height: 24px; margin: 0; font-size: 15px; font-weight: bold; letter-spacing: 2px; color: #67f5d1; }
canvas { display: block; width: 100%; height: auto; border: 1px solid #28354a; border-radius: 8px; background: #0b111c; box-shadow: 0 0 35px #0009; touch-action: none; }
button { background: #67f5d1; color: #07120f; border: 0; border-radius: 6px; padding: 12px 16px; margin: 8px 4px; font-family: inherit; font-weight: bold; cursor: pointer; }
button:hover { background: #a0ffe7; }
button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
button.selected { outline: 2px solid white; outline-offset: 2px; }
.controls { color: #a8b3c9; line-height: 2; font-size: 12px; margin-top: 12px; }
.mobile-controls { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.mobile-controls button { flex: 1; margin: 0; padding: 12px 5px; user-select: none; touch-action: none; }
@media (min-width: 700px) { .mobile-controls { display: none; } }
@media (max-width: 420px) {
  body { padding: 10px; }
  .scoreboard { gap: 6px; }
  .center-label { font-size: 10px; }
  button { padding: 10px 9px; font-size: 11px; }
}
</style>
</head>
<body>
<main class="game">
  <h1>PONG</h1>
  <div class="subtitle">THE ORIGINAL ARCADE DUEL</div>

  <div class="scoreboard">
    <div>
      <div class="score" id="scoreL">0</div>
      <div class="player-name">PLAYER 1</div>
    </div>
    <div class="center-label">TIMED MATCH</div>
    <div>
      <div class="score" id="scoreR">0</div>
      <div class="player-name">PLAYER 2</div>
    </div>
  </div>

  <div class="status-row">
    <div class="timer" id="timer">05:00</div>
    <div class="status" id="status" aria-live="polite">READY TO PLAY</div>
  </div>

  <canvas id="game" width="800" height="500" aria-label="Pong game"></canvas>

  <div>
    <button id="easy" class="selected" type="button">EASY (5 MIN)</button>
    <button id="hard" type="button">HARD (1 MIN)</button>
  </div>
  <div>
    <button id="start" type="button">START GAME</button>
    <button id="reset" type="button">RESTART</button>
  </div>

  <div class="controls">
    PLAYER 1: W / S | PLAYER 2: ↑ / ↓<br>
    First to 5 points wins. Press SPACE to pause/resume.
  </div>

  <div class="mobile-controls">
    <button id="leftUp" type="button">P1 ▲</button>
    <button id="leftDown" type="button">P1 ▼</button>
    <button id="rightUp" type="button">P2 ▲</button>
    <button id="rightDown" type="button">P2 ▼</button>
  </div>
</main>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const WIN_SCORE = 5;
const EASY_TIME = 300;
const HARD_TIME = 60;
const PADDLE_W = 12;
const PADDLE_H = 90;
const PADDLE_SPEED = 7;
const BALL_RADIUS = 8;

const scoreLElement = document.getElementById("scoreL");
const scoreRElement = document.getElementById("scoreR");
const statusElement = document.getElementById("status");
const timerElement = document.getElementById("timer");
const startButton = document.getElementById("start");
const easyButton = document.getElementById("easy");
const hardButton = document.getElementById("hard");

let left, right, ball;
let scoreL = 0;
let scoreR = 0;
let selectedDifficulty = "easy";
let timeLeft = EASY_TIME;
let running = false;
let paused = false;
let finished = false;
let winner = null;
let lastTime = 0;
let serveDirection = 1;
const keys = new Set();

function makePaddle(x) {
  return { x, y: H / 2 - PADDLE_H / 2 };
}

function resetBall(direction = 1) {
  ball = {
    x: W / 2,
    y: H / 2,
    vx: 5 * direction,
    vy: (Math.random() * 4 - 2) || 1
  };
}

function roundedRect(x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function formatTime(seconds) {
  const total = Math.max(0, Math.ceil(seconds));
  const minutes = Math.floor(total / 60);
  const secs = total % 60;
  return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

function getMatchStatus() {
  if (scoreL === 4 && scoreR === 4) {
    return { text: "SUDDEN DEATH", color: "#ff5577" };
  }
  if (scoreL === 4 || scoreR === 4) {
    return { text: "MATCH POINT", color: "#ffd166" };
  }
  return {
    text: running ? "MATCH IN PROGRESS" : "READY TO PLAY",
    color: "#67f5d1"
  };
}

function syncUI() {
  scoreLElement.textContent = scoreL;
  scoreRElement.textContent = scoreR;
  timerElement.textContent = formatTime(timeLeft);

  if (finished) {
    statusElement.textContent = winner === "left" ? "PLAYER 1 WINS!" : "PLAYER 2 WINS!";
    statusElement.style.color = "#67f5d1";
    startButton.textContent = "MATCH OVER";
    return;
  }

  if (paused) {
    statusElement.textContent = "PAUSED";
    statusElement.style.color = "#ffd166";
    startButton.textContent = "RESUME GAME";
    return;
  }

  const status = getMatchStatus();
  statusElement.textContent = status.text;
  statusElement.style.color = status.color;
  startButton.textContent = running ? "PAUSE GAME" : "START GAME";
}

function finishMatch() {
  if (finished) return;
  running = false;
  paused = false;
  finished = true;

  if (scoreL > scoreR) winner = "left";
  else if (scoreR > scoreL) winner = "right";
  else winner = Math.random() < 0.5 ? "left" : "right";

  keys.clear();
  syncUI();
}

function startGame() {
  if (finished) return;
  running = true;
  paused = false;
  lastTime = 0;
  syncUI();
}

function togglePause() {
  if (finished) return;
  if (!running) {
    startGame();
    return;
  }
  paused = !paused;
  lastTime = 0;
  syncUI();
}

function resetGame() {
  left = makePaddle(30);
  right = makePaddle(W - 30 - PADDLE_W);
  scoreL = 0;
  scoreR = 0;
  running = false;
  paused = false;
  finished = false;
  winner = null;
  timeLeft = selectedDifficulty === "easy" ? EASY_TIME : HARD_TIME;
  serveDirection = 1;
  keys.clear();
  resetBall(serveDirection);
  syncUI();
  draw();
}

function chooseDifficulty(difficulty) {
  selectedDifficulty = difficulty;
  easyButton.classList.toggle("selected", difficulty === "easy");
  hardButton.classList.toggle("selected", difficulty === "hard");
  resetGame();
}

function clampPaddle(paddle) {
  paddle.y = Math.max(0, Math.min(H - PADDLE_H, paddle.y));
}

function movePaddles(dt) {
  const step = PADDLE_SPEED * dt;
  if (keys.has("w")) left.y -= step;
  if (keys.has("s")) left.y += step;
  if (keys.has("arrowup")) right.y -= step;
  if (keys.has("arrowdown")) right.y += step;
  clampPaddle(left);
  clampPaddle(right);
}

function pointFor(player) {
  if (player === "left") scoreL++;
  else scoreR++;

  if (scoreL >= WIN_SCORE || scoreR >= WIN_SCORE) {
    winner = scoreL > scoreR ? "left" : "right";
    finished = true;
    running = false;
    paused = false;
    syncUI();
    return;
  }

  serveDirection = player === "left" ? 1 : -1;
  resetBall(serveDirection);
  syncUI();
}

function hitPaddle(paddle, direction) {
  const impact = (ball.y - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2);
  const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.06, 13);
  const angle = impact * (Math.PI / 3);
  ball.vx = direction * speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle);
  ball.x = direction > 0 ? paddle.x + PADDLE_W + BALL_RADIUS : paddle.x - BALL_RADIUS;
}

function update(dt) {
  movePaddles(dt);
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.y - BALL_RADIUS <= 0) {
    ball.y = BALL_RADIUS;
    ball.vy = Math.abs(ball.vy);
  }
  if (ball.y + BALL_RADIUS >= H) {
    ball.y = H - BALL_RADIUS;
    ball.vy = -Math.abs(ball.vy);
  }

  if (
    ball.vx < 0 &&
    ball.x - BALL_RADIUS <= left.x + PADDLE_W &&
    ball.x + BALL_RADIUS >= left.x &&
    ball.y + BALL_RADIUS >= left.y &&
    ball.y - BALL_RADIUS <= left.y + PADDLE_H
  ) {
    hitPaddle(left, 1);
  }

  if (
    ball.vx > 0 &&
    ball.x + BALL_RADIUS >= right.x &&
    ball.x - BALL_RADIUS <= right.x + PADDLE_W &&
    ball.y + BALL_RADIUS >= right.y &&
    ball.y - BALL_RADIUS <= right.y + PADDLE_H
  ) {
    hitPaddle(right, -1);
  }

  if (ball.x < -BALL_RADIUS) pointFor("right");
  else if (ball.x > W + BALL_RADIUS) pointFor("left");
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b111c";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#28354a";
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 12]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.shadowColor = "#67f5d1";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#67f5d1";
  roundedRect(left.x, left.y, PADDLE_W, PADDLE_H, 5);
  roundedRect(right.x, right.y, PADDLE_W, PADDLE_H, 5);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (!running) {
    let message = "PRESS START";
    let submessage = "W / S  •  ARROW KEYS";

    if (paused) {
      message = "PAUSED";
      submessage = "PRESS SPACE TO RESUME";
    } else if (finished) {
      message = winner === "left" ? "PLAYER 1 WINS!" : "PLAYER 2 WINS!";
      submessage = "RESTART TO PLAY AGAIN";
    }

    ctx.fillStyle = "#f5f7ff";
    ctx.textAlign = "center";
    ctx.font = "bold 27px monospace";
    ctx.fillText(message, W / 2, H / 2 - 5);
    ctx.fillStyle = "#8490a8";
    ctx.font = "13px monospace";
    ctx.fillText(submessage, W / 2, H / 2 + 25);
  }
}

function frame(time) {
  const dt = lastTime ? Math.min((time - lastTime) / (1000 / 60), 2) : 1;
  lastTime = time;

  if (running && !paused && !finished) {
    timeLeft = Math.max(0, timeLeft - dt / 60);
    if (timeLeft <= 0) finishMatch();
    else update(dt);
  }

  draw();
  requestAnimationFrame(frame);
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (["arrowup", "arrowdown", " "].includes(key)) event.preventDefault();
  keys.add(key);
  if (key === " " && !event.repeat) togglePause();
});

document.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));

window.addEventListener("blur", () => {
  keys.clear();
  if (running && !paused && !finished) {
    paused = true;
    lastTime = 0;
    syncUI();
  }
});

startButton.addEventListener("click", () => {
  if (paused) startGame();
  else if (!running) startGame();
  else togglePause();
});

document.getElementById("reset").addEventListener("click", resetGame);
easyButton.addEventListener("click", () => chooseDifficulty("easy"));
hardButton.addEventListener("click", () => chooseDifficulty("hard"));

function bindHold(id, key) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    keys.add(key);
    button.setPointerCapture(event.pointerId);
  });
  function release() { keys.delete(key); }
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

bindHold("leftUp", "w");
bindHold("leftDown", "s");
bindHold("rightUp", "arrowup");
bindHold("rightDown", "arrowdown");

resetGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
